function renderParts() {

function selectPart(id,zoom=false) {

  if(id){state.hidden.delete(id);if(state.only&&state.only!==id)state.only=null;const p=active.parts.get(id);if(p.kind==='cavity'){state.cavities=true;state.translucent=true;}}

function selectMarker(id) {

function positionMarker(){

function renderInfo() {

}
function register(gltf,metadata,mode) {
  const parts=new Map(),records=new Map();
  for(const d of metadata.bones||[])records.set(d.node||`b|${d.id}`,{...d,kind:'bone'});
  for(const d of metadata.cavities||[])records.set(d.node||`o|${d.id}`,{...d,kind:'cavity'});
  for(const d of metadata.structures||[])records.set(d.node||`o|${d.id}`,d);
  gltf.scene.traverse(mesh=>{
    if(!mesh.isMesh)return;
    let n=mesh;while(n&&!records.has(n.name))n=n.parent;
    const d=mode==='microct'?{id:'microct_surface',kind:'bone',ru:'Череп · поверхность микро-КТ',modelNote:'Единая сегментированная поверхность одного препарата. Отдельные кости и точки TA98 здесь не выделены.'}:n?records.get(n.name):null;
    if(!d)throw new Error(`В описании модели отсутствует структура ${mesh.name}`);
    if(!mesh.geometry.attributes.normal)mesh.geometry.computeVertexNormals();
    mesh.material=new THREE.MeshStandardMaterial({color:bone,roughness:.72,metalness:0,side:THREE.DoubleSide});
    let part=parts.get(d.id);if(!part){part={id:d.id,kind:d.kind,data:d,meshes:[]};parts.set(d.id,part);}part.meshes.push(mesh);mesh.userData.detailId=d.id;
  });
  if(!parts.size)throw new Error('В файле не найдена поверхность модели');
  if(mode!=='microct'&&parts.size!==records.size)throw new Error('Состав модели и описание не совпадают');

  return {group:gltf.scene,parts,bounds,metadata};
}
async function loadModel(mode,onProgress) {
  const loader=new GLTFLoader();await MeshoptDecoder.ready;loader.setMeshoptDecoder(MeshoptDecoder);
  const stem={z:'skull-z-detail',microct:'skull-microct',openear:'skull-openear'}[mode];
  const filename=stem+'.glb';
  const metadataPromise=fetch(stem+'.json').then(r=>{if(!r.ok)throw new Error(`Описание модели: ${r.status}`);return r.json();}).then(async metadata=>{if(mode==='openear'){const response=await fetch('skull-openear-landmarks.json');if(!response.ok)throw Error('Не удалось загрузить ориентиры OpenEar');const native=await response.json();metadata.markers=native.markers;}return metadata;});
  const gltfPromise=new Promise((resolve,reject)=>loader.load(filename,resolve,onProgress,reject));
  const [metadata,gltf]=await Promise.all([metadataPromise,gltfPromise]);return register(gltf,metadata,mode);
}
async function setMode(mode) {

  if(active)scene.remove(active.group);active=null;

  $('#view option[value="left"]').textContent=mode!=='z'?'Боковой вид 2':'Слева';
  $('#cutPlane option[value="sagittal"]').textContent=mode!=='z'?'Сагиттальная — боковой срез':'Сагиттальная — справа / слева';
  for(const [id,label] of Object.entries({ant:'Спереди',post:'Сзади',sup:'Сверху',inf:'Снизу'}))$('#view option[value="'+id+'"]').textContent=mode==='openear'?'Осевой вид '+({ant:1,post:2,sup:5,inf:6}[id]):label;
  if(mode==='openear'){ $('#view option[value="right"]').textContent='Осевой вид 3';$('#view option[value="left"]').textContent='Осевой вид 4'; }
  for(const [id,label] of Object.entries({sagittal:mode==='microct'?'Сагиттальная — боковой срез':'Сагиттальная — справа / слева',coronal:'Фронтальная — спереди / сзади',axial:'Горизонтальная — сверху / снизу'}))$('#cutPlane option[value="'+id+'"]').textContent=mode==='openear'?'Плоскость '+({sagittal:1,coronal:2,axial:3}[id]):label;
  $('#zSwitches').hidden=mode!=='z';$('#earSwitches').hidden=mode!=='openear';$('#load').hidden=false;$('#retry').hidden=true;$('#loadProgress').hidden=false;$('#loadProgress').removeAttribute('value');$('#loadTitle').textContent='Загружаю модель…';$('#loadText').textContent='Подготовка просмотра';$('#parts').innerHTML='';$('#modelInfo').innerHTML='';$('#partCount').textContent='';renderSelection();dirty=true;

    active=model;scene.add(active.group);state.translucent=mode==='openear';state.cavities=mode==='openear';state.ready=true;state.loading=false;$('#load').hidden=true;$('#view').value='antlat';apply();renderSelection();renderParts();renderInfo();resize();if(region&&mode===region.mode)setPreset(region.presets[0].id);else frame('antlat');return true;

function setCut(plane,value=state.cut,reverse=state.reverse){if(!['off','sagittal','coronal','axial'].includes(plane))return;state.clip=plane;state.cut=Math.max(0,Math.min(1,Number(value)));state.reverse=!!reverse;apply();}
function setPreset(id){

function reset() {if(region&&state.mode===region.mode){setPreset(region.presets[0].id);return;}state.hidden.clear();state.only=null;state.selected=null;state.marker=null;$('#markerSelection').hidden=true;state.cavities=state.mode==='openear';state.translucent=state.mode==='openear';state.clip='off';state.cut=.5;state.reverse=false;$('#view').value='antlat';apply();renderSelection();renderParts();frame('antlat');}
$('#view').onchange=()=>frame();$('#fit').onclick=()=>frame();$('#reset').onclick=reset;$('#retry').onclick=()=>setMode(state.mode);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#cutPlane').onchange=()=>setCut($('#cutPlane').value);$('#cutPosition').oninput=()=>setCut(state.clip,+$('#cutPosition').value/100);$('#reverseCut').onchange=()=>setCut(state.clip,state.cut,$('#reverseCut').checked);

$('#showCavities').onchange=()=>{state.cavities=$('#showCavities').checked;if(state.cavities)state.translucent=true;else if(active?.parts.get(state.selected)?.kind==='cavity')state.selected=null;state.only=null;apply();renderParts();renderSelection();};
$('#translucent').onchange=()=>{state.translucent=$('#translucent').checked;apply();};
$('#earTranslucent').onchange=()=>{state.translucent=$('#earTranslucent').checked;apply();};
$('#themeButton').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark'||!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=dark?'light':'dark';const url=new URL(location.href);url.searchParams.set('theme',dark?'light':'dark');history.replaceState(null,'',url);dirty=true;};
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{

  const hit=state.translucent?hits.find(h=>{const p=active.parts.get(h.object.userData.detailId);return state.mode==='openear'?!p.data.context:state.cavities&&p.kind==='cavity';})||hits[0]:hits[0];

window.__detail={state,setMode,setCut,setPreset,selectPart,selectMarker,reset,frame,counts:()=>active?{parts:active.parts.size,bones:[...active.parts.values()].filter(p=>p.kind==='bone').length,cavities:[...active.parts.values()].filter(p=>p.kind==='cavity').length,visible:[...active.parts.values()].filter(visible).length}:null};
window.__ready=true;resize();setMode(region?.mode||initialQuery.get('mode')||'z').then(ok=>{if(!ok)return;if(initialQuery.has('marker'))selectMarker(initialQuery.get('marker'));else if(initialQuery.has('part'))selectPart(initialQuery.get('part'),true);});
